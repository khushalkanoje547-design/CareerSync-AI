<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerSync AI — Build Your Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <header class="brand">
      <span class="brand-mark">CareerSync</span><span class="brand-mark-accent">AI</span>
    </header>

    <main class="form-card">
      <h1>Tell us about you</h1>
      <p class="subtitle">This takes under a minute, and it's what powers your matches.</p>

      <form id="profileForm">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required placeholder="e.g. Khushal Kanoje">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@college.edu">
        </div>

        <div class="row">
          <div class="field">
            <label for="branch">Branch</label>
            <input type="text" id="branch" required placeholder="e.g. Computer Science">
          </div>
          <div class="field">
            <label for="year">Year</label>
            <select id="year" required>
              <option value="">Select</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="General">General</option>
              <option value="OBC">OBC</option>
              <option value="SC">SC</option>
              <option value="ST">ST</option>
              <option value="EWS">EWS</option>
            </select>
          </div>
          <div class="field">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Aurangabad">
          </div>
        </div>

        <div class="field">
          <label for="skills">Skills</label>
          <input type="text" id="skills" placeholder="React, Python, Public Speaking (comma-separated)">
        </div>

        <button type="submit" id="submitBtn">Find my opportunities</button>
        <p class="error" id="errorMsg"></p>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
