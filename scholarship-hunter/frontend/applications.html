<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications — CareerSync AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="page">
    <header class="top-bar">
      <a href="index.html" class="brand">CareerSync <span class="brand-accent">AI</span></a>
      <div class="opp-actions-right">
        <a href="opportunities.html" class="edit-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Browse matches
        </a>
        <a href="profile.html" class="edit-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          Edit profile
        </a>
      </div>
    </header>
 
    <div class="opps-header">
      <p class="opps-eyebrow">Tracked by you</p>
      <h1>My applications</h1>
      <p class="opps-stat" id="appsStat">Loading…</p>
    </div>
 
    <div class="filter-bar" id="filterBar" hidden>
      <button class="filter-pill active" data-status="all">All</button>
      <button class="filter-pill" data-status="saved">Saved</button>
      <button class="filter-pill" data-status="applied">Applied</button>
    </div>
 
    <div id="content">
      <div class="loading">Loading your saved and applied opportunities…</div>
    </div>
  </div>
 
  <script src="applications.js"></script>
</body>
</html>
